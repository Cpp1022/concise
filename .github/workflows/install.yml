name: Installer checks

on:
  push:
    branches: [main]
    paths:
      - 'install.py'
      - 'install.sh'
      - 'skills/concise/SKILL.md'
      - 'tests/**'
      - '.github/workflows/install.yml'
  pull_request:
    paths:
      - 'install.py'
      - 'install.sh'
      - 'skills/concise/SKILL.md'
      - 'tests/**'
      - '.github/workflows/install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installation, rollback, recovery and uninstall tests
        run: python -m unittest discover -s tests -v
      - name: Native shell install, update, hook and uninstall
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import tomllib

          repo = Path.cwd()
          skill = (repo / 'skills/concise/SKILL.md').read_text(encoding='utf-8').rstrip()
          managed = ('instructions.md', 'config.toml', 'hooks.json',
                     'hooks/concise-user-prompt-submit.sh',
                     'hooks/concise-user-prompt-submit.ps1')
          with tempfile.TemporaryDirectory(prefix='concise-ci-', dir=os.environ['RUNNER_TEMP']) as temporary:
              root = Path(temporary)
              for source in ('checkout', 'public-pipeline'):
                  home = root / source / 'config with spaces'
                  home.mkdir(parents=True)
                  scratch = root / source / 'downloads'
                  scratch.mkdir()
                  env = dict(os.environ, CODEX_HOME=str(home), TMPDIR=str(scratch))
                  originals = {
                      'instructions.md': 'USER ORIGINAL\r\n'.encode('utf-8-sig'),
                      'config.toml': b'# preserve\r\ndeveloper_instructions = "USER RULE" # keep\r\n[features]\r\ncodex_hooks = true\r\n',
                      'hooks.json': b'{"hooks":{"SessionStart":[{"hooks":[{"type":"command","command":"echo foreign"}]}]},"user_setting":42}',
                  }
                  for name, data in originals.items():
                      (home / name).write_bytes(data)
                  def snapshot():
                      return {name: (home / name).read_bytes() if (home / name).exists() else None for name in managed}
                  before = snapshot()
                  def invoke(action):
                      if source == 'checkout':
                          command = ['sh', str(repo / 'install.sh'), action]
                      else:
                          command = ['bash', '-o', 'pipefail', '-c',
                              'curl -fsSL https://raw.githubusercontent.com/Cpp1022/concise/main/install.sh | sh -s -- ' + action]
                      subprocess.run(command, cwd=root, env=env, check=True, timeout=90)
                  invoke('codex')
                  installed = snapshot()
                  config = tomllib.loads((home / 'config.toml').read_text(encoding='utf-8'))
                  assert config['developer_instructions'].startswith('USER RULE\n\n')
                  assert skill in config['developer_instructions']
                  assert 'model_instructions_file' not in config
                  assert (home / 'instructions.md').read_bytes().startswith(originals['instructions.md'])
                  hooks = json.loads((home / 'hooks.json').read_text())
                  assert hooks['hooks']['SessionStart'][0]['hooks'][0]['command'] == 'echo foreign'
                  assert hooks['user_setting'] == 42
                  result = subprocess.run(['sh', str(home / 'hooks/concise-user-prompt-submit.sh')], env=env, check=True, capture_output=True, timeout=10)
                  payload = json.loads(result.stdout)['hookSpecificOutput']
                  assert payload['hookEventName'] == 'UserPromptSubmit'
                  assert payload['additionalContext'].startswith('concise:')
                  invoke('codex')
                  assert snapshot() == installed, 'Repeated install changed managed files'
                  invoke('uninstall')
                  assert snapshot() == before, 'Original file bytes were not restored'
                  assert not (home / '.concise-install/state.json').exists()
                  assert not (home / '.concise-install/pending.json').exists()
                  assert not list(scratch.iterdir()), 'Download scratch files remain'
                  print(source + ': install, repeated install, hook, preservation and uninstall passed')
          PY
